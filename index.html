<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Lissajous / Harmonograph 3D</title>
<style>
  :root{--bg:#0f141b;--panel:#121a23;--muted:#9fb3c9;--accent:#6ab0ff}
  html,body{height:100%;margin:0;background:var(--bg);color:#e6eef7;font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial}
  .wrap{display:grid;grid-template-columns:420px 1fr;min-height:100vh}
  @media (max-width:900px){.wrap{grid-template-columns:1fr;grid-template-rows:auto 1fr}}
  aside{padding:14px;border-right:1px solid rgba(255,255,255,.06)}
  @media (max-width:900px){aside{border-right:none;border-bottom:1px solid rgba(255,255,255,.06)}}
  h1{margin:0 0 10px;font-size:18px;font-weight:600;letter-spacing:.2px}
  .panel{padding:10px;border:1px solid rgba(255,255,255,.06);border-radius:8px;background:var(--panel)}
  .group{margin:12px 0 14px;border:1px solid rgba(255,255,255,.06);border-radius:10px;padding:10px}
  .group h2{margin:0 0 8px;font-size:14px;font-weight:600;letter-spacing:.2px;color:#dfe9f5}
  .field{display:grid;grid-template-columns:92px 1fr;align-items:center;gap:10px;margin:8px 0}
  .field label{font-size:12px;color:var(--muted)}
  .field input[type="range"]{width:100%}
  .field input[type="number"], .field select{
    width:100%;background:#0c1218;border:1px solid rgba(255,255,255,.08);color:#e6eef7;border-radius:6px;padding:6px 8px
  }
  .subparams{margin:6px 0 0 0;padding:8px;border-radius:8px;background:rgba(255,255,255,.03);display:none}
  .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  button{background:#182432;border:1px solid rgba(255,255,255,.08);color:#e6eef7;border-radius:8px;padding:8px 12px;cursor:pointer}
  main{position:relative}
  canvas{display:block;width:100%;height:100%}
  .hud{position:absolute;left:12px;bottom:12px;background:rgba(0,0,0,.35);backdrop-filter:blur(4px);padding:8px 10px;border-radius:8px;font-size:12px}
</style>
</head>
<body>
<div class="wrap">
  <aside>
    <h1>Curva 3D (por eje)</h1>
    <div class="panel">

      <!-- Grupo X -->
      <div class="group" id="grp-x">
        <h2>Eje X</h2>
        <div class="field">
          <label>Tipo</label>
          <select id="x-type" class="ctrl">
            <option value="sine" selected>Ortogonal (seno)</option>
            <option value="shear">Shear (base + s·x)</option>
            <option value="mod">Modulación (AM)</option>
            <option value="parab">Parabólica (rail)</option>
            <option value="tanh">Aplanada (tanh)</option>
          </select>
        </div>
        <div class="field">
          <label>Frecuencia</label>
          <input id="x-f" class="ctrl" type="range" min="1" max="10" step="1" value="3">
        </div>
        <div class="field">
          <label>Amplitud</label>
          <input id="x-A" class="ctrl" type="range" min="10" max="120" step="1" value="80">
        </div>
        <div class="field">
          <label>Offset</label>
          <input id="x-C" class="ctrl" type="range" min="-40" max="40" step="1" value="0">
        </div>
        <!-- Subparámetros dependientes del tipo -->
        <div id="x-sub" class="subparams">
          <!-- Shear: s -->
          <div class="field sub-s">
            <label>Shear s</label>
            <input id="x-s" class="ctrl" type="range" min="0" max="0.6" step="0.01" value="0.22">
          </div>
          <!-- Mod: m, g -->
          <div class="field sub-m">
            <label>AM m</label>
            <input id="x-m" class="ctrl" type="range" min="0" max="0.6" step="0.01" value="0.30">
          </div>
          <div class="field sub-m">
            <label>AM g</label>
            <input id="x-g" class="ctrl" type="range" min="1" max="6" step="1" value="2">
          </div>
          <!-- Parab: a -->
          <div class="field sub-a">
            <label>Parab a</label>
            <input id="x-a" class="ctrl" type="range" min="0" max="0.03" step="0.001" value="0.012">
          </div>
          <!-- Tanh: beta -->
          <div class="field sub-b">
            <label>β tanh</label>
            <input id="x-b" class="ctrl" type="range" min="0.6" max="2.0" step="0.05" value="1.20">
          </div>
        </div>
      </div>

      <!-- Grupo Y -->
      <div class="group" id="grp-y">
        <h2>Eje Y</h2>
        <div class="field">
          <label>Tipo</label>
          <select id="y-type" class="ctrl">
            <option value="sine" selected>Ortogonal (seno)</option>
            <option value="shear">Shear (base + s·x)</option>
            <option value="mod">Modulación (AM)</option>
            <option value="parab">Parabólica (rail)</option>
            <option value="tanh">Aplanada (tanh)</option>
          </select>
        </div>
        <div class="field">
          <label>Frecuencia</label>
          <input id="y-f" class="ctrl" type="range" min="1" max="10" step="1" value="5">
        </div>
        <div class="field">
          <label>Amplitud</label>
          <input id="y-A" class="ctrl" type="range" min="10" max="120" step="1" value="80">
        </div>
        <div class="field">
          <label>Offset</label>
          <input id="y-C" class="ctrl" type="range" min="-40" max="40" step="1" value="0">
        </div>
        <div id="y-sub" class="subparams">
          <div class="field sub-s">
            <label>Shear s</label>
            <input id="y-s" class="ctrl" type="range" min="0" max="0.6" step="0.01" value="0.22">
          </div>
          <div class="field sub-m">
            <label>AM m</label>
            <input id="y-m" class="ctrl" type="range" min="0" max="0.6" step="0.01" value="0.30">
          </div>
          <div class="field sub-m">
            <label>AM g</label>
            <input id="y-g" class="ctrl" type="range" min="1" max="6" step="1" value="2">
          </div>
          <div class="field sub-a">
            <label>Parab a</label>
            <input id="y-a" class="ctrl" type="range" min="0" max="0.03" step="0.001" value="0.012">
          </div>
          <div class="field sub-b">
            <label>β tanh</label>
            <input id="y-b" class="ctrl" type="range" min="0.6" max="2.0" step="0.05" value="1.20">
          </div>
        </div>
      </div>

      <!-- Grupo Z -->
      <div class="group" id="grp-z">
        <h2>Eje Z</h2>
        <div class="field">
          <label>Tipo</label>
          <select id="z-type" class="ctrl">
            <option value="sine" selected>Ortogonal (seno)</option>
            <option value="shear">Shear (base + s·x)</option>
            <option value="mod">Modulación (AM)</option>
            <option value="parab">Parabólica (rail)</option>
            <option value="tanh">Aplanada (tanh)</option>
          </select>
        </div>
        <div class="field">
          <label>Frecuencia</label>
          <input id="z-f" class="ctrl" type="range" min="1" max="10" step="1" value="2">
        </div>
        <div class="field">
          <label>Amplitud</label>
          <input id="z-A" class="ctrl" type="range" min="10" max="120" step="1" value="80">
        </div>
        <div class="field">
          <label>Offset</label>
          <input id="z-C" class="ctrl" type="range" min="-40" max="40" step="1" value="0">
        </div>
        <div id="z-sub" class="subparams">
          <div class="field sub-s">
            <label>Shear s</label>
            <input id="z-s" class="ctrl" type="range" min="0" max="0.6" step="0.01" value="0.18">
          </div>
          <div class="field sub-m">
            <label>AM m</label>
            <input id="z-m" class="ctrl" type="range" min="0" max="0.6" step="0.01" value="0.30">
          </div>
          <div class="field sub-m">
            <label>AM g</label>
            <input id="z-g" class="ctrl" type="range" min="1" max="6" step="1" value="2">
          </div>
          <div class="field sub-a">
            <label>Parab a</label>
            <input id="z-a" class="ctrl" type="range" min="0" max="0.03" step="0.001" value="0.012">
          </div>
          <div class="field sub-b">
            <label>β tanh</label>
            <input id="z-b" class="ctrl" type="range" min="0.6" max="2.0" step="0.05" value="1.20">
          </div>
        </div>
      </div>

      <div class="row">
        <button id="reset">Recentrar</button>
      </div>
    </div>
  </aside>

  <main>
    <div id="stage"></div>
    <div class="hud">Gira con el dedo/ratón • Zoom con rueda/pellizco</div>
  </main>
</div>

<!-- Importmap (opcional) -->
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from "https://unpkg.com/three@0.160.0/build/three.module.js";
import { OrbitControls } from "https://unpkg.com/three@0.160.0/examples/jsm/controls/OrbitControls.js";

// --- estado global ---
let scene, camera, renderer, controls, tube, head;
let axisDots = [];      // 6 bolitas sobre ejes
let pathPoints = [];
let tHead = 0;
let playing = true;

// helpers UI
const $ = (id)=>document.getElementById(id);

// fases fijas "limpias"
const PHI_X = 0.0;
const PHI_Y = Math.PI/2;   // ~1.5708
const PHI_Z = Math.PI/3;   // ~1.0472

init();
generateCurve();
animate();

// -------------------- init / escena --------------------
function addAxes(length=260){
  const group = new THREE.Group();
  const mk = (c)=> new THREE.LineBasicMaterial({ color:c, transparent:true, opacity:0.6 });
  const make = (dir) => {
    const g = new THREE.BufferGeometry().setFromPoints([
      new THREE.Vector3(-length*(dir==='x'), -length*(dir==='y'), -length*(dir==='z')),
      new THREE.Vector3( length*(dir==='x'),  length*(dir==='y'),  length*(dir==='z'))
    ]);
    const m = dir==='x'? mk(0xff5555): dir==='y'? mk(0x66ff66): mk(0x66aaff);
    return new THREE.Line(g,m);
  };
  group.add(make('x'), make('y'), make('z'));
  return group;
}

function init(){
  const elStage = document.getElementById('stage');

  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0f141b);

  camera = new THREE.PerspectiveCamera(55, 1, 0.1, 5000);
  camera.position.set(180,140,180);

  renderer = new THREE.WebGLRenderer({antialias:true});
  elStage.appendChild(renderer.domElement);
  onResize();
  window.addEventListener('resize', onResize);

  controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;

  const light = new THREE.DirectionalLight(0xffffff, 1.2);
  light.position.set(1,1,1);
  scene.add(light, new THREE.AmbientLight(0xffffff, 0.3));

  const grid = new THREE.GridHelper(400, 20, 0x32506a, 0x223443);
  grid.material.opacity = 0.25; grid.material.transparent = true;
  scene.add(grid);
  scene.add( addAxes(260) );

  head = new THREE.Mesh(
    new THREE.SphereGeometry(3, 24, 24),
    new THREE.MeshStandardMaterial({color:0xffffaa, emissive:0x222200, roughness:.3})
  );
  scene.add(head);

  // bolitas sobre ejes
  const matAxisDot = new THREE.MeshBasicMaterial({color:0xb0c4de, transparent:true, opacity:0.5});
  for(let i=0;i<6;i++){
    const d = new THREE.Mesh(new THREE.SphereGeometry(1.4, 16, 16), matAxisDot);
    scene.add(d); axisDots.push(d);
  }

  // listeners (cualquier .ctrl re-renderiza)
  document.querySelectorAll('.ctrl').forEach(el=>{
    el.addEventListener('input', ()=>{ toggleSubparams(); generateCurve(); });
    el.addEventListener('change', ()=>{ toggleSubparams(); generateCurve(); });
  });

  // botón recentrar
  $('reset').addEventListener('click', ()=>{
    controls.reset();
    camera.position.set(180,140,180);
  });

  toggleSubparams();
}

function onResize(){
  const elStage = document.getElementById('stage');
  const w = elStage.clientWidth || window.innerWidth;
  const isMobile = window.matchMedia("(max-width: 900px)").matches;
  let h;
  if (isMobile) {
    const aside = document.querySelector('aside');
    const asideH = aside ? aside.getBoundingClientRect().height : 0;
    h = Math.max(320, Math.floor(window.innerHeight - asideH));
  } else {
    h = elStage.clientHeight || window.innerHeight;
  }
  camera.aspect = w/h; camera.updateProjectionMatrix();
  renderer.setSize(w, h, false);
}

// -------------------- evaluación por eje --------------------
function evalBaseSine(t, A, f, phi){ return A * Math.sin(f*t + phi); }
function evalModulated(t, A, f, phi, m, g){ return A * (1 + m * Math.sin(g*t)) * Math.sin(f*t + phi); }
function evalParab(t, A, f, phi, a){ return A * Math.sin(f*t + phi) + a * Math.pow(t - Math.PI, 2); }
function evalTanh(t, A, f, phi, beta){ return A * Math.tanh(beta * Math.sin(f*t + phi)); }

// Devuelve {x(t), y(t), z(t)} según tipos y parámetros actuales
function pointAt(t){
  // leer UI
  const Ax = parseFloat($('x-A').value), fx = parseInt($('x-f').value,10), Cx = parseFloat($('x-C').value);
  const Ay = parseFloat($('y-A').value), fy = parseInt($('y-f').value,10), Cy = parseFloat($('y-C').value);
  const Az = parseFloat($('z-A').value), fz = parseInt($('z-f').value,10), Cz = parseFloat($('z-C').value);

  const typeX = $('x-type').value, typeY = $('y-type').value, typeZ = $('z-type').value;

  // primero X (referencia para shear)
  let x = baseByType('x', t, Ax, fx, PHI_X, Cx, typeX, null);
  // luego Y y Z (pueden usar shear con x como referencia)
  let y = baseByType('y', t, Ay, fy, PHI_Y, Cy, typeY, x);
  let z = baseByType('z', t, Az, fz, PHI_Z, Cz, typeZ, x);

  return {x,y,z};
}

function baseByType(axis, t, A, f, phi, C, kind, xRef){
  switch(kind){
    case 'sine':  return evalBaseSine(t, A, f, phi) + C;
    case 'mod':   return evalModulated(t, A, f, phi, parseFloat($(axis+'-m').value), parseInt($(axis+'-g').value,10)) + C;
    case 'parab': return evalParab(t, A, f, phi, parseFloat($(axis+'-a').value)) + C;
    case 'tanh':  return evalTanh(t, A, f, phi, parseFloat($(axis+'-b').value)) + C;
    case 'shear': {
      const s = parseFloat($(axis+'-s').value);
      const base = evalBaseSine(t, A, f, phi);
      const ref = (typeof xRef === 'number') ? xRef : base; // si X aún no existe, usa su propio base
      return base + s * ref + C;
    }
    default: return evalBaseSine(t, A, f, phi) + C;
  }
}

function toggleSubparams(){
  ['x','y','z'].forEach(ax=>{
    const type = $(ax+'-type').value;
    const sub = $(ax+'-sub');
    if(!sub) return;
    // ocultar todo
    sub.style.display = 'none';
    sub.querySelectorAll('.field').forEach(f=>f.style.display='none');

    // mostrar los del tipo elegido
    if(type==='shear'){ sub.style.display='block'; sub.querySelectorAll('.sub-s').forEach(f=>f.style.display='grid'); }
    if(type==='mod'){   sub.style.display='block'; sub.querySelectorAll('.sub-m').forEach(f=>f.style.display='grid'); }
    if(type==='parab'){ sub.style.display='block'; sub.querySelectorAll('.sub-a').forEach(f=>f.style.display='grid'); }
    if(type==='tanh'){  sub.style.display='block'; sub.querySelectorAll('.sub-b').forEach(f=>f.style.display='grid'); }
  });
}

// -------------------- generación de curva --------------------
function generateCurve(){
  const T = Math.PI * 2; // periodo
  const N = 3000;

  // grosor fijo agradable
  const thick = 1.2;
  const headSize = Math.max(2.4 * thick, 2.2);

  if(head){
    head.geometry.dispose();
    head.geometry = new THREE.SphereGeometry(headSize, 24, 24);
  }

  pathPoints = [];
  for(let i=0;i<N;i++){
    const t = T * (i/N);
    const {x,y,z} = pointAt(t);
    pathPoints.push(new THREE.Vector3(x,y,z));
  }

  if (tube) { tube.geometry.dispose(); scene.remove(tube); }

  const curve = new THREE.CatmullRomCurve3(pathPoints, true, 'catmullrom', 0.0);
  const geom  = new THREE.TubeGeometry(curve, N, thick, 32, true);
  const mat   = new THREE.MeshStandardMaterial({ color:0xffffff, roughness:.3, metalness:.15 });
  tube = new THREE.Mesh(geom, mat);
  scene.add(tube);
}

// -------------------- animación --------------------
function animate(){
  requestAnimationFrame(animate);
  controls.update();

  if (playing && pathPoints.length){
    tHead += 0.0004;
    if (tHead > 1) tHead = 0;

    const idx = tHead * (pathPoints.length - 1);
    const i0 = Math.floor(idx), i1 = Math.min(pathPoints.length - 1, i0 + 1);
    const p  = pathPoints[i0].clone().lerp(pathPoints[i1], idx - i0);

    head.position.copy(p);

    // bolitas sobre ejes
    const { x, y, z } = p;
    const a1 = new THREE.Vector3(x,0,0), a2 = new THREE.Vector3(0,y,0);
    const a3 = new THREE.Vector3(x,0,0), a4 = new THREE.Vector3(0,0,z);
    const a5 = new THREE.Vector3(0,y,0), a6 = new THREE.Vector3(0,0,z);
    const axisPts = [a1,a2,a3,a4,a5,a6];
    axisPts.forEach((pt,i)=> axisDots[i].position.copy(pt));
  }

  renderer.render(scene, camera);
}
</script>
</body>
</html>
