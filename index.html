<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Lissajous / Harmonograph 3D</title>
<style>
  :root{--bg:#0f141b;--panel:#121a23;--muted:#9fb3c9;--accent:#6ab0ff}
  html,body{height:100%;margin:0;background:var(--bg);color:#e6eef7;font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial}
  .wrap{display:grid;grid-template-columns:340px 1fr;min-height:100vh}
  @media (max-width:900px){.wrap{grid-template-columns:1fr;grid-template-rows:auto 1fr}}
  aside{padding:14px;border-right:1px solid rgba(255,255,255,.06)}
  @media (max-width:900px){aside{border-right:none;border-bottom:1px solid rgba(255,255,255,.06)}}
  h1{margin:0 0 8px;font-size:18px;font-weight:600;letter-spacing:.2px}
  .row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
  .chip{background:var(--panel);border:1px solid rgba(255,255,255,.06);border-radius:8px}
  .tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
  .tab{padding:8px 10px;border-radius:7px;background:var(--panel);border:1px solid rgba(255,255,255,.06);cursor:pointer;font-size:13px}
  .tab.active{outline:1px solid var(--accent)}
  .panel{display:none;padding:10px;border:1px solid rgba(255,255,255,.06);border-radius:8px;background:var(--panel)}
  .panel.active{display:block}
  .field{display:grid;grid-template-columns:1fr 68px;align-items:center;gap:10px;margin:6px 0}
  .field label{font-size:12px;color:var(--muted)}
  .field input[type="range"]{width:100%}
  .field input[type="number"]{width:100%;background:#0c1218;border:1px solid rgba(255,255,255,.08);color:#e6eef7;border-radius:6px;padding:6px 8px}
  .small{font-size:12px;color:var(--muted);margin-top:6px}
  button{background:#182432;border:1px solid rgba(255,255,255,.08);color:#e6eef7;border-radius:8px;padding:8px 10px;cursor:pointer}
  main{position:relative}
  canvas{display:block;width:100%;height:100%}
  .hud{position:absolute;left:12px;bottom:12px;background:rgba(0,0,0,.35);backdrop-filter:blur(4px);padding:8px 10px;border-radius:8px;font-size:12px}
</style>
</head>
<body>
<div class="wrap">
  <aside>
    <h1>Curvas Lissajous / Harmonograph 3D</h1>

    <div class="tabs" id="tabs">
      <div class="tab active" data-tab="freqs">Frecuencias</div>
      <div class="tab" data-tab="amps">Amplitudes</div>
      <div class="tab" data-tab="fases">Fases</div>
      <div class="tab" data-tab="render">Render</div>
    </div>

    <!-- Frecuencias -->
    <div class="panel active" id="panel-freqs">
      <div class="field"><label>f<sub>x</sub> (a)</label><input id="fx" type="number" step="0.1" value="3"></div>
      <div class="field"><label>f<sub>y</sub> (b)</label><input id="fy" type="number" step="0.1" value="2"></div>
      <div class="field"><label>f<sub>z</sub> (c)</label><input id="fz" type="number" step="0.1" value="5"></div>
      <div class="field"><label>Damping d (0–1)</label><input id="damp" type="number" step="0.01" min="0" max="1" value="0.00"></div>
      <div class="small">Consejo: relaciones racionales (p.ej. 3:2:5) dan figuras cerradas bonitas.</div>
    </div>

    <!-- Amplitudes -->
    <div class="panel" id="panel-amps">
      <div class="field"><label>A (x)</label><input id="ax" type="number" step="1" value="80"></div>
      <div class="field"><label>B (y)</label><input id="ay" type="number" step="1" value="80"></div>
      <div class="field"><label>C (z)</label><input id="az" type="number" step="1" value="80"></div>
    </div>

    <!-- Fases -->
    <div class="panel" id="panel-fases">
      <div class="field"><label>ϕ<sub>x</sub> (rad)</label><input id="phx" type="number" step="0.1" value="0.0"></div>
      <div class="field"><label>ϕ<sub>y</sub> (rad)</label><input id="phy" type="number" step="0.1" value="1.57"></div>
      <div class="field"><label>ϕ<sub>z</sub> (rad)</label><input id="phz" type="number" step="0.1" value="0.0"></div>
    </div>

    <!-- Render -->
    <div class="panel" id="panel-render">
      <div class="field"><label>Duración t<sub>max</sub></label><input id="tmax" type="number" step="0.5" value="40"></div>
      <div class="field"><label>Puntos (detalle)</label><input id="pts" type="number" step="100" value="3000"></div>
      <div class="field"><label>Grosor tubo</label><input id="thick" type="number" step="0.2" value="1.6"></div>
      <div class="row">
        <button id="regenerar">Generar</button>
        <button id="animar">Play/Pause</button>
        <button id="reset">Recentrar</button>
      </div>
      <div class="small">“Generar” recalcula la geometría. “Play” mueve una bolita por el recorrido.</div>
    </div>
  </aside>

  <main>
    <div id="stage"></div>
    <div class="hud">Gira con el dedo/ratón • Zoom con rueda/pellizco</div>
  </main>
</div>
<!-- Mapea 'three' a la CDN -->
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
<!-- Three.js desde CDN -->
<script type="module">
  import * as THREE from "three";
  import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const elStage = document.getElementById('stage');
let scene, camera, renderer, controls, tube, head, grid, axes;
let playing = true;
let pathPoints = [];
let tMax = 40;
init();
generateCurve();

function init(){
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0f141b);

  camera = new THREE.PerspectiveCamera(55, 1, 0.1, 5000);
  camera.position.set(180, 140, 180);

  renderer = new THREE.WebGLRenderer({antialias:true});
  elStage.appendChild(renderer.domElement);
  onResize();
  window.addEventListener('resize', onResize);

  controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;

  const light = new THREE.DirectionalLight(0xffffff, 1.3);
  light.position.set(1,1,1);
  scene.add(light);
  scene.add(new THREE.AmbientLight(0xffffff, 0.3));

  // Plano y ejes estilo “pizarra”
  grid = new THREE.GridHelper(400, 20, 0x32506a, 0x223443);
  grid.material.opacity = 0.35; grid.material.transparent = true;
  scene.add(grid);

  axes = new THREE.AxesHelper(120);
  scene.add(axes);

  head = new THREE.Mesh(
    new THREE.SphereGeometry(2.8, 24, 24),
    new THREE.MeshStandardMaterial({color:0xffffaa, emissive:0x333300, roughness:.25, metalness:.1})
  );
  scene.add(head);

  animate();
}

function onResize(){
  const w = elStage.clientWidth || window.innerWidth;
  const h = elStage.clientHeight || (window.innerHeight - 0);
  camera.aspect = w/h; camera.updateProjectionMatrix();
  renderer.setSize(w, h, false);
}

// UI tabs
document.querySelectorAll('.tab').forEach(t=>{
  t.onclick = ()=>{
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
    t.classList.add('active');
    document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
    document.getElementById('panel-'+t.dataset.tab).classList.add('active');
  }
});

// Helpers lectura
const val = id => parseFloat(document.getElementById(id).value);

document.getElementById('regenerar').onclick = generateCurve;
document.getElementById('animar').onclick = ()=> playing = !playing;
document.getElementById('reset').onclick = ()=>{
  controls.reset();
  camera.position.set(180,140,180);
};



function generateCurve(){
  // parámetros
  const a = val('fx'), b = val('fy'), c = val('fz');
  const A = val('ax'), B = val('ay'), C = val('az');
  const phx = val('phx'), phy = val('phy'), phz = val('phz');
  const d = val('damp');         // amortiguamiento
  tMax = val('tmax');
  const N = Math.max(200, Math.floor(val('pts')));
  const thick = Math.max(0.2, val('thick'));

  // puntos
  pathPoints = [];
  for(let i=0;i<=N;i++){
    const t = tMax * (i/N);
    const k = Math.exp(-d*t);
    const x = (A*k) * Math.sin(a*t + phx);
    const y = (B*k) * Math.sin(b*t + phy);
    const z = (C*k) * Math.sin(c*t + phz);
    pathPoints.push(new THREE.Vector3(x,y,z));
  }

  // curva + tubo
  if (tube) { tube.geometry.dispose(); scene.remove(tube); }
  const curve = new THREE.CatmullRomCurve3(pathPoints);
  const geom = new THREE.TubeGeometry(curve, Math.min(2000, N*1.2), thick, 32, false);
  const mat = new THREE.MeshStandardMaterial({
    color:0xffffff, roughness:.35, metalness:.15,
    emissive:0x0, envMapIntensity:.7
  });
  tube = new THREE.Mesh(geom, mat);
  scene.add(tube);

  // mover cabeza al inicio
  head.position.copy(pathPoints[0]);
}

let tHead = 0;
function animate(){
  requestAnimationFrame(animate);
  controls.update();

  if (playing && pathPoints.length){
    tHead += 0.0025 * (60/60);            // velocidad
    if (tHead>1) tHead=0;
    const idx = tHead*(pathPoints.length-1);
    const i0 = Math.floor(idx), i1 = Math.min(pathPoints.length-1, i0+1);
    const p = pathPoints[i0].clone().lerp(pathPoints[i1], idx-i0);
    head.position.copy(p);
  }

  renderer.render(scene, camera);
}
</script>
</body>
</html>
