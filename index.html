<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Lissajous / Harmonograph 3D</title>
<style>
  :root{--bg:#0f141b;--panel:#121a23;--muted:#9fb3c9;--accent:#6ab0ff}
  html,body{height:100%;margin:0;background:var(--bg);color:#e6eef7;font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial}
  .wrap{display:grid;grid-template-columns:340px 1fr;min-height:100vh}
  @media (max-width:900px){.wrap{grid-template-columns:1fr;grid-template-rows:auto 1fr}}
  aside{padding:14px;border-right:1px solid rgba(255,255,255,.06)}
  @media (max-width:900px){aside{border-right:none;border-bottom:1px solid rgba(255,255,255,.06)}}
  h1{margin:0 0 8px;font-size:18px;font-weight:600;letter-spacing:.2px}
  .row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
  .chip{background:var(--panel);border:1px solid rgba(255,255,255,.06);border-radius:8px}
  .tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
  .tab{padding:8px 10px;border-radius:7px;background:var(--panel);border:1px solid rgba(255,255,255,.06);cursor:pointer;font-size:13px}
  .tab.active{outline:1px solid var(--accent)}
  .panel{display:none;padding:10px;border:1px solid rgba(255,255,255,.06);border-radius:8px;background:var(--panel)}
  .panel.active{display:block}
  .field{display:grid;grid-template-columns:1fr 68px;align-items:center;gap:10px;margin:6px 0}
  .field label{font-size:12px;color:var(--muted)}
  .field input[type="range"]{width:100%}
  .field input[type="number"]{width:100%;background:#0c1218;border:1px solid rgba(255,255,255,.08);color:#e6eef7;border-radius:6px;padding:6px 8px}
  .small{font-size:12px;color:var(--muted);margin-top:6px}
  button{background:#182432;border:1px solid rgba(255,255,255,.08);color:#e6eef7;border-radius:8px;padding:8px 10px;cursor:pointer}
  main{position:relative}
  canvas{display:block;width:100%;height:100%}
  .hud{position:absolute;left:12px;bottom:12px;background:rgba(0,0,0,.35);backdrop-filter:blur(4px);padding:8px 10px;border-radius:8px;font-size:12px}
  /* aside más ancho en desktop, full en móvil */
.wrap{display:grid;grid-template-columns:420px 1fr;min-height:100vh}
@media (max-width:900px){.wrap{grid-template-columns:1fr;grid-template-rows:auto 1fr}}
aside{padding:14px;border-right:1px solid rgba(255,255,255,.06)}
@media (max-width:900px){aside{border-right:none;border-bottom:1px solid rgba(255,255,255,.06)}}

/* campos: etiqueta estrecha + slider 100% */
.field{display:grid;grid-template-columns:64px 1fr;align-items:center;gap:12px;margin:10px 0}
.field label{font-size:12px;color:var(--muted)}
.field input[type="range"]{width:100%}

/* botón */
button{background:#182432;border:1px solid rgba(255,255,255,.08);color:#e6eef7;border-radius:8px;padding:8px 12px;cursor:pointer}

</style>
</head>
<body>
<div class="wrap">
 <aside>
  <h1>Curva 3D de Frecuencias</h1>

  <div class="panel active">
    <div class="field"><label>f<sub>x</sub></label>
      <input id="fx" type="range" min="1" max="10" step="1" value="3">
    </div>
    <div class="field"><label>f<sub>y</sub></label>
      <input id="fy" type="range" min="1" max="10" step="1" value="2">
    </div>
    <div class="field"><label>f<sub>z</sub></label>
      <input id="fz" type="range" min="1" max="10" step="1" value="5">
    </div>

  

    <div class="row" style="margin-top:10px">
      <button id="reset">Recentrar</button>
    </div>
  </div>
</aside>


  <main>
    <div id="stage"></div>
    <div class="hud">Gira con el dedo/ratón • Zoom con rueda/pellizco</div>
  </main>
</div>
<!-- Mapea 'three' a la CDN -->
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
<!-- Three.js desde CDN -->
<script type="module">
import * as THREE from "https://unpkg.com/three@0.160.0/build/three.module.js";
import { OrbitControls } from "https://unpkg.com/three@0.160.0/examples/jsm/controls/OrbitControls.js";

// --- estado global ---
let scene, camera, renderer, controls, tube, head;
let projBalls = [];        // 3 bolitas en planos (XY, XZ, YZ)
let axisDots = [];         // 6 bolitas sobre ejes (para cada plano, 2 ejes)
let guideLines = [];       // 6 líneas finas hacia ejes
let pathPoints = [];
let headProjLines = [];   // 3 líneas desde la bolita principal a pXY, pXZ, pYZ

let tHead = 0;
let playing = true;

// UI
const $ = id => document.getElementById(id);

init();
generateCurve();
animate();
function addAxes(length=260){
  const group = new THREE.Group();
  const mk = (c)=> new THREE.LineBasicMaterial({ color:c, transparent:true, opacity:0.6 });

  const makeAxis = (dir) => {
    const g = new THREE.BufferGeometry().setFromPoints([
      new THREE.Vector3(-length*(dir==='x'), -length*(dir==='y'), -length*(dir==='z')),
      new THREE.Vector3( length*(dir==='x'),  length*(dir==='y'),  length*(dir==='z'))
    ]);
    const mat = dir==='x' ? mk(0xff5555) : dir==='y' ? mk(0x66ff66) : mk(0x66aaff);
    return new THREE.Line(g, mat);
  };

  group.add( makeAxis('x'), makeAxis('y'), makeAxis('z') );
  return group;
}

function init(){
  const elStage = document.getElementById('stage');

  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0f141b);

  camera = new THREE.PerspectiveCamera(55, 1, 0.1, 5000);
  camera.position.set(180,140,180);

  renderer = new THREE.WebGLRenderer({antialias:true});
  elStage.appendChild(renderer.domElement);
  onResize();
  window.addEventListener('resize', onResize);

  controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;

  const light = new THREE.DirectionalLight(0xffffff, 1.2);
  light.position.set(1,1,1);
  scene.add(light, new THREE.AmbientLight(0xffffff, 0.3));

  const grid = new THREE.GridHelper(400, 20, 0x32506a, 0x223443);
  grid.material.opacity = 0.25; grid.material.transparent = true;
  scene.add(grid);
 scene.add( addAxes(260) );

  head = new THREE.Mesh(
    new THREE.SphereGeometry(3, 24, 24),
    new THREE.MeshStandardMaterial({color:0xffffaa, emissive:0x222200, roughness:.3})
  );
  scene.add(head);

  // bolitas de proyección en planos (color azul claro translúcido)
  const matProj = new THREE.MeshBasicMaterial({color:0x66ccff, transparent:true, opacity:0.45});
  for(let i=0;i<3;i++){
    const b = new THREE.Mesh(new THREE.SphereGeometry(1.8, 16, 16), matProj);
    scene.add(b); projBalls.push(b);
  }

  // bolitas sobre ejes (gris translúcido)
  const matAxisDot = new THREE.MeshBasicMaterial({color:0xb0c4de, transparent:true, opacity:0.5});
  for(let i=0;i<6;i++){
    const d = new THREE.Mesh(new THREE.SphereGeometry(1.4, 16, 16), matAxisDot);
    scene.add(d); axisDots.push(d);
  }

  // líneas guía hacia ejes (muy finas y discretas)
  const lineMat = new THREE.LineBasicMaterial({color:0x88aacc, transparent:true, opacity:0.35});
  for(let i=0;i<6;i++){
    const geom = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), new THREE.Vector3()]);
    const ln = new THREE.Line(geom, lineMat);
    scene.add(ln); guideLines.push(ln);
  }
// líneas desde la bolita principal hacia sus proyecciones en cada plano
const matHP = new THREE.LineBasicMaterial({ color:0x99e0ff, transparent:true, opacity:0.35 });
for(let i=0;i<3;i++){
  const g = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), new THREE.Vector3()]);
  const ln = new THREE.Line(g, matHP);
  scene.add(ln); headProjLines.push(ln);
}

  // sliders → actualización en vivo
  ['fx','fy','fz'].forEach(id => $(id).addEventListener('input', generateCurve));
  // botón recentrar
  $('reset').addEventListener('click', ()=>{
    controls.reset();
    camera.position.set(180,140,180);
  });
}

function onResize(){
  const elStage = document.getElementById('stage');
  const w = elStage.clientWidth || window.innerWidth;

  // alto disponible en móvil = alto de ventana - alto del aside
  const isMobile = window.matchMedia("(max-width: 900px)").matches;
  let h;
  if (isMobile) {
    const aside = document.querySelector('aside');
    const asideH = aside ? aside.getBoundingClientRect().height : 0;
    h = Math.max(320, Math.floor(window.innerHeight - asideH));
  } else {
    // desktop: usa todo el alto del contenedor/ventana
    h = elStage.clientHeight || window.innerHeight;
  }

  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h, false);
}


function generateCurve(){
  const fx = parseInt($('fx').value,10);
  const fy = parseInt($('fy').value,10);
  const fz = parseInt($('fz').value,10);

  // parámetros fijos
  const A=80,B=80,C=80, phx=0, phy=0, phz=0;
  const T = 2*Math.PI;
  const N = 3000;

  // grosor fijo (75% de tamaño base)
  const thick = 3 * (A / 100); // = 0.6 si A=80, puedes subirlo a gusto
  const headSize = Math.max(2.2 * thick, 2.2);

  head.geometry.dispose();
  head.geometry = new THREE.SphereGeometry(headSize, 24, 24);

  // puntos
  pathPoints = [];
  for(let i=0;i<N;i++){
    const t = T * (i/N);
    const x = A*Math.sin(fx*t + phx);
    const y = B*Math.sin(fy*t + phy);
    const z = C*Math.sin(fz*t + phz);
    pathPoints.push(new THREE.Vector3(x,y,z));
  }

  if (tube) { tube.geometry.dispose(); scene.remove(tube); }

  const curve = new THREE.CatmullRomCurve3(pathPoints, true, 'catmullrom', 0.0);
  const geom  = new THREE.TubeGeometry(curve, N, thick, 32, true);
  const mat   = new THREE.MeshStandardMaterial({ color:0xffffff, roughness:.3, metalness:.15 });
  tube = new THREE.Mesh(geom, mat);
  scene.add(tube);
}


function animate(){
  requestAnimationFrame(animate);
  controls.update();

  if (playing && pathPoints.length){
    tHead += 0.0004;            // velocidad
    if (tHead > 1) tHead = 0;

    const idx = tHead * (pathPoints.length - 1);
    const i0 = Math.floor(idx), i1 = Math.min(pathPoints.length - 1, i0 + 1);
    const p  = pathPoints[i0].clone().lerp(pathPoints[i1], idx - i0); // <- p nace aquí
    head.position.copy(p);

    // proyecciones en planos
    const {x, y, z} = p;
    const pXY = new THREE.Vector3(x, y, 0);
    const pXZ = new THREE.Vector3(x, 0, z);
    const pYZ = new THREE.Vector3(0, y, z);

    // bolitas de plano
    projBalls[0].position.copy(pXY);
    projBalls[1].position.copy(pXZ);
    projBalls[2].position.copy(pYZ);

    // puntos sobre ejes
    const a1 = new THREE.Vector3(x,0,0), a2 = new THREE.Vector3(0,y,0); // XY
    const a3 = new THREE.Vector3(x,0,0), a4 = new THREE.Vector3(0,0,z); // XZ
    const a5 = new THREE.Vector3(0,y,0), a6 = new THREE.Vector3(0,0,z); // YZ
    const axisPts = [a1,a2,a3,a4,a5,a6];
    axisPts.forEach((pt,i)=> axisDots[i].position.copy(pt));

    // líneas plano → ejes
    updateLine(guideLines[0], pXY, a1);
    updateLine(guideLines[1], pXY, a2);
    updateLine(guideLines[2], pXZ, a3);
    updateLine(guideLines[3], pXZ, a4);
    updateLine(guideLines[4], pYZ, a5);
    updateLine(guideLines[5], pYZ, a6);

    // líneas bolita principal → proyecciones de plano
    updateLine(headProjLines[0], p, pXY);
    updateLine(headProjLines[1], p, pXZ);
    updateLine(headProjLines[2], p, pYZ);
  }

  renderer.render(scene, camera);
}



function updateLine(line, vStart, vEnd){
  const pos = line.geometry.attributes.position;
  pos.setXYZ(0, vStart.x, vStart.y, vStart.z);
  pos.setXYZ(1, vEnd.x,   vEnd.y,   vEnd.z);
  pos.needsUpdate = true;
}
</script>



</body>
</html>
